<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>글쓰기</title></head>
<body>
<div layout:fragment="content">
    <h2>글쓰기</h2>
    <!-- th:object에 BoardWriteRequest 바인딩 -->
    <form th:action="@{/board/write}" method="post"
          th:object="${boardWriteRequest}">
        <div>
            <input type="text" th:field="*{title}" placeholder="제목을 입력하세요">
            <span th:if="${#fields.hasErrors('title')}"
                  th:errors="*{title}" class="field-error"></span>
        </div>
        <div>
      <textarea th:field="*{content}"
                placeholder="내용을 입력하세요" rows="10"></textarea>
            <span th:if="${#fields.hasErrors('content')}"
                  th:errors="*{content}" class="field-error"></span>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn-primary">등록</button>
            <a th:href="@{/board/list}" class="btn-secondary">취소</a>
        </div>
    </form>
</div>
</body></html>
