<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head><title>게시글 상세</title></head>
<body>
<div layout:fragment="content">
    <!-- board는 BoardResponse (password 없음) -->
    <article>
        <h2 th:text="${board.title}"></h2>
        <p>
            작성자: <span th:text="${board.writer}"></span>
            &nbsp;|&nbsp;
            조회: <span th:text="${board.viewCount}"></span>
        </p>
        <div class="content" th:text="${board.content}"></div>
    </article>
    <a th:href="@{/board/list}" class="btn-secondary">목록</a>
    <hr>

    <!-- comments는 List<CommentResponse> -->
    <section class="comments">
        <h3>댓글 <span th:text="${#lists.size(comments)}"></span>개</h3>
        <div th:each="c : ${comments}" class="comment-item">
            <span class="comment-writer" th:text="${c.writer}"></span>
            <p class="comment-content"   th:text="${c.content}"></p>
            <small th:text="${#temporals.format(c.createdAt,'MM/dd HH:mm')}"></small>
        </div>

        <!-- 댓글 폼: CommentSaveRequest 바인딩, 로그인 사용자만 표시 -->
        <form th:action="@{/comment/save}" method="post"
              th:object="${commentRequest}"
              sec:authorize="isAuthenticated()">
            <input type="hidden" name="boardId" th:value="${board.id}">
            <div>
        <textarea th:field="*{content}"
                  placeholder="댓글을 입력하세요" rows="3"></textarea>
                <span th:if="${#fields.hasErrors('content')}"
                      th:errors="*{content}" class="field-error"></span>
            </div>
            <button type="submit">댓글 등록</button>
        </form>
    </section>
</div>
</body></html>
